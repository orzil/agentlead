name: FB night run

# Ten hours of small, spaced-out searching - 20:00 to 05:00 Israel time.
#
# NOTHING HERE TOUCHES facebook.com. Logged-out scraping is dead from every
# datacenter IP (measured 2026-08-09: www, mbasic, m, touch and a mobile UA all
# redirect to login.php, and three cloud runs produced 0 Facebook leads, walled
# on the first group). So the run works the SEARCH INDEX instead, which already
# crawled those public posts - zero Facebook requests, zero ban risk.
#
# Why 20 small runs rather than one long one: DuckDuckGo challenges an IP after
# ~1-2 queries. A single long job holds one IP and is walled within minutes;
# every GitHub run gets a fresh one. A shared cursor (night_search_cursor) walks
# the query rotation across runs, so the night covers ~40 queries in total.
#
# Per run: 2 queries, drawn from one rotation weighted toward post search
# (leads now) over group/WhatsApp discovery (doors Or still has to walk through).

on:
  schedule:
    # Every 15 min. Cadence IS throughput here: DuckDuckGo allows ~2 queries
    # per IP and each GitHub run gets a fresh one, so doubling the runs doubles
    # the night's query budget. Runs are ~3 min now that no browser is involved.
    - cron: "0,15,30,45 17-23 * * *"   # 20:00-02:59 Israel
    - cron: "0,15,30,45 0-2 * * *"     # 03:00-05:59 Israel
  workflow_dispatch:
    inputs:
      budget:
        description: "Search queries this run (DDG walls at ~2)"
        default: "2"

concurrency:
  group: leadagent            # shares leads.db with the other workflows
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # commits findings so they survive the runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # No Playwright: nothing in this workflow loads a browser page any more.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore lead DB
        uses: actions/cache/restore@v4
        with:
          path: leads.db
          key: leadsdb-${{ github.run_id }}
          restore-keys: leadsdb-

      - name: Search, promote, report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_BACKEND: gemini
          NIGHT_SEARCH_PER_RUN: ${{ inputs.budget || '2' }}
          # Must stay empty: IL,US,EU would silently discard newly discovered
          # AU/CA/GLOBAL groups from the pool.
          FB_REGIONS: ""
          FB_PUBLIC_ENABLED: "0"
        run: |
          python -X utf8 discover_fb_groups.py \
            --night --promote --write --json --notify --shortlist

      - name: Nightly summary (last slot only)
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # github.event.schedule exposes the cron STRING, not the firing time,
          # so the final slot is identified by the clock.
          NOW=$(date -u +%H:%M)
          if [[ "$NOW" > "02:15" && "$NOW" < "02:59" ]]; then
            python -X utf8 discover_fb_groups.py --summary
          else
            echo "not the last slot ($NOW UTC) - no summary"
          fi

      - name: Save lead DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: leads.db
          key: leadsdb-${{ github.run_id }}

      - name: Commit findings
        if: always()
        run: |
          git config user.name "agentlead-bot"
          git config user.email "noreply@github.com"
          git add discovered_groups.json facebook_groups.md whatsapp_groups.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change in findings"
          else
            git commit -m "night run: search sweep $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      - name: Upload DB snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadsdb-${{ github.run_id }}
          path: leads.db
          if-no-files-found: ignore
          retention-days: 3
