name: AgentLead cloud run

# Runs the whole pipeline (email + Reddit/LinkedIn/boards + gentle Facebook
# scraping) a few times a day ON GITHUB'S IPs — so the Facebook rate-limit
# throttle can never touch your own account. Relevant leads (score >= PUSH)
# are pushed to Telegram automatically. Nothing needs your PC to be on.
#
# Setup: see SETUP_CLOUD.md. You must add these repository secrets:
#   GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, IMAP_USER, IMAP_PASSWORD

on:
  schedule:
    # Times are UTC (Israel = UTC+3). :17 avoids top-of-hour scheduler congestion.
    # Spread across IL / EU / US active posting hours.
    - cron: "17 5 * * *"    # 08:17 IL - ~morning IL/EU
    - cron: "17 11 * * *"   # 14:17 IL - ~midday EU / morning US-east
    - cron: "17 16 * * *"   # 19:17 IL - ~midday US
    # Night block. US/CA clients post through their working day, which is Or's
    # night, and he is asleep for all of it - so this is the cheapest throughput
    # in the schedule. One pass every ~2h; each takes ~30-40 min, which still
    # leaves the 15-min fbnight slots most of their air (they share a
    # concurrency group, so an overlapping fbnight run is dropped, not queued).
    - cron: "17 21 * * *"   # 00:17 IL - ~evening US / late IL
    - cron: "17 23 * * *"   # 02:17 IL
    - cron: "17 1 * * *"    # 04:17 IL
    - cron: "17 3 * * *"    # 06:17 IL - last full pass before the morning report
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      fb_regions:
        description: "Facebook regions to scrape (IL,US,EU)"
        default: "IL,US,EU"
      fb_groups_per_run:
        description: "Groups to rotate through this run"
        default: "6"

concurrency:
  group: leadagent          # never let two runs mutate the shared DB at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 30 was too tight and silently cost real coverage: `reddit` alone takes
    # 13-17 min on a GitHub IP (Reddit 429s nearly every sub, so the 20s/40s
    # backoff fires ~11 times), and `linkedin` another 5-7. Measured 2026-08-13:
    # the pass finishes in ~29 min when Reddit behaves and gets killed mid-run
    # when it does not - 2 of the last 3 scheduled runs were cancelled at 30:00,
    # losing every source after `linkedin` (aijobs, companies, telegram,
    # jobboards, jobicy, remotive, fbsearch, whatsapp, feedback, linkcheck).
    # The tail itself only costs ~7 min; the variance is upstream.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Persist leads.db (dedup state) across runs via cache. Kept OUT of git so
      # the repo can be public (unlimited Actions minutes) without exposing leads.
      - name: Restore lead DB
        uses: actions/cache/restore@v4
        with:
          path: leads.db
          key: leadsdb-${{ github.run_id }}
          restore-keys: leadsdb-

      - name: Run one pass
        env:
          LLM_BACKEND: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Without this the cloud could FIND leads but not score them (no
          # Ollama on a runner, Gemini's free tier dead most of the day), so
          # everything waited up to 2h for cloud_sync to carry it home. With it
          # the cloud scores and pushes to Telegram the moment it finds
          # something - the single biggest delay removed.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Not set yet - empty keys are filtered out by config.active_providers(),
          # so these are inert until Or adds either secret. Both are genuinely
          # free and far larger than OpenRouter's 50/day, which is the binding
          # constraint on how much the cloud can score. See PROJECT_STATUS.md.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          # Gentle cloud Facebook settings
          # OFF since 2026-08-09: measured 0 leads across every cloud run,
          # walled on the first group each time - Meta blocks datacenter IPs
          # outright. fbsearch_fetcher covers Facebook through the search index
          # instead. Local scraping still works if ever re-enabled by hand.
          FB_PUBLIC_ENABLED: "0"
          FB_IGNORE_DAILY_CAP: "1"
          FB_REGIONS: ${{ github.event.inputs.fb_regions || 'IL,US,EU' }}
          FB_GROUPS_PER_RUN: ${{ github.event.inputs.fb_groups_per_run || '6' }}
          FB_GROUP_GAP_SECONDS: "90"
          FB_POSTS_PER_GROUP: "12"
        run: python -X utf8 main.py --once

      # Mop up leads an EARLIER pass had to store unscored.
      #
      # The cloud's scoring budget is tiny and time-boxed, and nothing here ever
      # re-visited a lead once it was stored unscored - so a lead found while the
      # quota was dead stayed unscored in the Actions cache indefinitely, and an
      # unscored lead is never pushed to Telegram no matter how good it is.
      # Measured 2026-08-13: OpenRouter free tier is 50 requests/DAY (header
      # x-ratelimit-limit: 50) resetting at 00:00 UTC, and Gemini's ~20/day
      # resets around 07:00 UTC. So the 21:17 and 23:17 passes score nothing and
      # the 01:17 / 03:17 passes have a fresh 50 to spend - this step is what
      # lets them spend it on the night's earlier finds.
      #
      # Capped at 25 so one pass cannot eat the whole daily bucket: live scoring
      # in the pass above has priority, and the next pass needs a share too.
      - name: Score what earlier passes could not
        if: always()
        env:
          LLM_BACKEND: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -X utf8 main.py --score-backlog 25 || true

      # Each run is a fresh IP, so it can afford its own 2 search queries on
      # top of the main pass - free extra throughput against the DDG wall.
      - name: Extra search slice
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_REGIONS: ""
          FB_PUBLIC_ENABLED: "0"
        run: python -X utf8 discover_fb_groups.py --night --promote --json || true

      - name: Save lead DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: leads.db
          key: leadsdb-${{ github.run_id }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: agent.log
          if-no-files-found: ignore
          retention-days: 7
